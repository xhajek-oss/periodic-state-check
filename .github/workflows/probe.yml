name: Resource probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check syntax
        run: python3 -m py_compile probe.py
      - name: Run diagnostic
        env:
          MONITOR_CONFIG: ${{ secrets.MONITOR_CONFIG }}
        run: python3 probe.py
